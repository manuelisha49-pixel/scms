<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Student Complaint Management System | Norzagaray College</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="auth-card" id="authCard">

  <!-- left: campus photo panel -->
  <div class="auth-photo">
    <img class="seal" src="logo.png" alt="Norzagaray College seal">
    <h2>STUDENT<br>MANAGEMENT</h2>
  </div>

  <!-- right: swappable sign in / register panels -->
  <div class="auth-tabs">
    <button class="tab on" id="tabIn" type="button" onclick="showSignIn()">Sign in</button>
    <button class="tab" id="tabUp" type="button" onclick="showRegister()">Register</button>
  </div>

    <!-- SIGN IN -->
    <div class="form-side side-signin">
      <form class="auth-form" action="dashboard.html" method="get">
        <h1>Sign in to your Account</h1>

        <label class="field">
          <span>Student No.</span>
          <input type="text" name="student_no" required>
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" name="password" required>
        </label>

        <a href="#" class="forgot">Forgot password?</a>

        <button class="btn btn-wide" type="submit">Sign in</button>
      </form>
    </div>

    <!-- REGISTER -->
    <div class="form-side side-register">
      <form class="auth-form" action="dashboard.html" method="get">
        <h1>Create an Account</h1>

        <label class="field">
          <span>Full name</span>
          <input type="text" name="full_name" required>
        </label>

        <label class="field">
          <span>Student No.</span>
          <input type="text" name="student_no" placeholder="2025-0448" required>
        </label>

        <label class="field">
          <span>Email</span>
          <input type="email" name="email" placeholder="you@norzagaraycollege.edu.ph" required>
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" name="password" placeholder="At least 8 characters" required>
        </label>

        <label class="field">
          <span>Confirm password</span>
          <input type="password" name="confirm_password" placeholder="Re-type your password" required>
        </label>

        <button class="btn btn-wide" type="submit" style="margin-top:6px">Sign up</button>
      </form>
    </div>

    <!-- the navy panel that slides across -->
    <div class="slide-panel">
      <div class="panel-face panel-left">
        <h2>Welcome Back!</h2>
        <p>Sign in to stay connected with us.</p>
        <p style="margin-top:-6px; font-size:.75rem;">Don't have an account yet?</p>
        <button class="btn btn-ghost" type="button" onclick="showRegister()">Sign up</button>
      </div>
      <div class="panel-face panel-right">
        <h2>Hi NC Students!</h2>
        <p>Sign up once, then raise concerns about a teacher, student, or damaged facility.</p>
        <button class="btn btn-ghost" type="button" onclick="showSignIn()">Back</button>
      </div>
    </div>

</div>

<script>
  const card = document.getElementById('authCard');
  const tabIn = document.getElementById('tabIn');
  const tabUp = document.getElementById('tabUp');

  function showRegister(){
    card.classList.add('show-register');
    tabUp.classList.add('on'); tabIn.classList.remove('on');
  }
  function showSignIn(){
    card.classList.remove('show-register');
    tabIn.classList.add('on'); tabUp.classList.remove('on');
  }
</script>
</body>
</html>
