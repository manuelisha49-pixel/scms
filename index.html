<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Student Complaint Management System | Norzagaray College</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="campus-bg"></div>

<div class="auth-crest">
  <img src="logo.png" alt="Norzagaray College seal">
  <div>
    <div class="brand-name">Norzagaray College</div>
    <div class="brand-sub">Student Complaint Management System</div>
  </div>
</div>

<div class="auth-card" id="authCard">

  <div class="auth-tabs">
    <button class="tab on" id="tabIn" type="button" onclick="showSignIn()">Sign in</button>
    <button class="tab" id="tabUp" type="button" onclick="showRegister()">Register</button>
  </div>

  <!-- SIGN IN -->
  <div class="form-side side-signin">
    <form class="auth-form" action="dashboard.html" method="get">
      <img class="crest-mark" src="assets/logo.png" alt="">
      <h1>Sign in</h1>
      <p class="lede">Use the school email issued by the Registrar.</p>

      <label class="field">
        <span>School email</span>
        <input type="email" name="email" placeholder="juan.delacruz@norzagaraycollege.edu.ph" required>
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" name="password" placeholder="••••••••" required>
      </label>

      <a href="#" class="forgot">Forgot your password?</a>

      <button class="btn btn-wide" type="submit">Sign in</button>
    </form>
  </div>

  <!-- REGISTER -->
  <div class="form-side side-register">
    <form class="auth-form" action="dashboard.html" method="get">
      <img class="crest-mark" src="assets/logo.png" alt="">
      <h1>Create an account</h1>
      <p class="lede">One account per enrolled student.</p>

      <label class="field">
        <span>Full name</span>
        <input type="text" name="name" placeholder="Juan P. Dela Cruz" required>
      </label>

      <label class="field">
        <span>Student number</span>
        <input type="text" name="sn" placeholder="2024-00518" required>
      </label>

      <label class="field">
        <span>Program</span>
        <select name="program" required>
          <option value="" selected disabled>Select your program</option>
          <option>BSED — Bachelor of Secondary Education</option>
          <option>BEED — Bachelor of Elementary Education</option>
          <option>HM — Hospitality Management</option>
          <option>CS — Computer Science</option>
        </select>
      </label>

      <label class="field">
        <span>School email</span>
        <input type="email" name="email" placeholder="juan.delacruz@norzagaraycollege.edu.ph" required>
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" name="password" placeholder="At least 8 characters" required>
      </label>

      <button class="btn btn-wide" type="submit" style="margin-top:8px">Create account</button>
    </form>
  </div>

</div>

<p class="auth-foot">Every report is logged with a reference number. Norzagaray College · Est. 2006</p>

<script>
  const card = document.getElementById('authCard');
  const tabIn = document.getElementById('tabIn');
  const tabUp = document.getElementById('tabUp');

  function showRegister(){
    card.classList.add('show-register');
    tabUp.classList.add('on'); tabIn.classList.remove('on');
  }
  function showSignIn(){
    card.classList.remove('show-register');
    tabIn.classList.add('on'); tabUp.classList.remove('on');
  }
</script>
</body>
</html>
